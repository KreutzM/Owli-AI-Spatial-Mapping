name: Bug report
description: Reproducible defect or false-safe concern
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and exact commit
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety / uncertainty impact
    validations:
      required: true
