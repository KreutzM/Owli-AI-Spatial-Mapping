name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Bootstrap and verify Gradle wrapper
        run: |
          chmod +x gradlew scripts/*.sh tools/*.py
          ./scripts/bootstrap-gradle-wrapper.sh
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
      - name: Architecture guardrails
        run: python tools/check_architecture_guardrails.py
      - name: Unit tests, lint, and debug build
        run: ./gradlew :mapping-core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          retention-days: 30
          if-no-files-found: ignore
          path: |
            mapping-core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/outputs/apk/debug/app-debug.apk
