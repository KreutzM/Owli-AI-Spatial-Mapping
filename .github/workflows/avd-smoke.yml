name: AVD Smoke

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/avd-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/avd-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: avd-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  managed-avd:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Bootstrap wrapper
        run: |
          chmod +x gradlew scripts/*.sh
          ./scripts/bootstrap-gradle-wrapper.sh
      - name: Run generic diagnostic-path AVD test
        run: ./gradlew pixel2Api35DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect --stacktrace --no-daemon
      - name: Upload managed-device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avd-smoke-reports
          retention-days: 30
          if-no-files-found: ignore
          path: app/build/reports/androidTests/managedDevice/
